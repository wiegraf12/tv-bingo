<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Vegas Bingo Host</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        @import url('https://googleapis.com');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a0505; /* Deep velvet maroon */
            color: #fff9e6;
            height: 100vh;
            display: grid;
            grid-template-columns: 380px 1fr;
            overflow: hidden;
            font-family: 'Ultra', serif;
        }
        /* Vintage Casino Sidebar */
        .sidebar {
            background: linear-gradient(180deg, #2d0b0b 0%, #150303 100%);
            border-right: 5px double #ffd700; /* Classic gold border */
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 10px 0 30px rgba(0,0,0,0.7);
        }
        .room-box h2 {
            font-family: 'Rye', cursive;
            font-size: 1.2rem;
            color: #ffd700;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0px #000;
        }
        .room-code {
            font-size: 3.8rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ffaa00;
            letter-spacing: 4px;
            background: #000;
            padding: 5px 20px;
            border-radius: 8px;
            border: 2px solid #ffd700;
        }
        #qrcode {
            background: #ffffff;
            padding: 12px;
            border-radius: 8px;
            margin: 20px 0;
            border: 4px solid #ffd700;
        }
        /* Fire TV Focus Action Engine - Vegas Sign Style */
        .btn-call {
            background: linear-gradient(135deg, #d41414 0%, #800000 100%);
            color: #ffd700;
            border: 3px solid #ffd700;
            padding: 20px;
            font-size: 1.6rem;
            font-family: 'Rye', cursive;
            border-radius: 0px; /* Sharp retro look */
            cursor: pointer;
            width: 100%;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 8px 0px #500000, 0 15px 20px rgba(0,0,0,0.5);
            text-shadow: 2px 2px 0px #000;
        }
        .btn-call:focus {
            background: #ffd700;
            color: #1a0505;
            border-color: #fff;
            transform: scale(1.04);
            box-shadow: 0 0 30px #ffd700, 0 8px 0px #b89600;
            text-shadow: none;
        }
        /* Main Vintage Display Board */
        .main-content {
            display: grid;
            grid-template-rows: 240px 1fr;
            padding: 40px;
            gap: 32px;
            background: radial-gradient(circle at 50% 50%, #4a1212 0%, #1a0505 100%);
        }
        .top-row {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 32px;
        }
        .current-number-box {
            background: #000;
            border: 4px gold double;
            border-radius: 50%; /* Classic ball shape */
            width: 180px;
            height: 180px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4), inset 0 0 20px rgba(255,255,255,0.2);
        }
        .current-number-box span {
            font-size: 0.75rem;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: Arial, sans-serif;
        }
        .huge-number {
            font-size: 5.5rem;
            color: #fff;
            text-shadow: 0 0 10px #ff3b3b;
        }
        .alert-banner {
            background: #ffd700;
            color: #1a0505;
            border: 6px double #d41414;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-family: 'Rye', cursive;
            box-shadow: 0 0 40px #ffd700;
            animation: marqueeLight 0.6s infinite alternate;
            display: none;
        }
        /* Retro Lightbulb Grid Matrix */
        .board-container {
            background: #0b0202;
            border: 4px solid #ffd700;
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            gap: 12px;
            box-shadow: inset 0 0 30px #000;
        }
        .ball {
            background: #251212;
            color: #5a3535;
            border-radius: 4px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            border: 1px solid #3a1a1a;
            transition: all 0.3s ease;
        }
        .ball.called {
            background: #ffd700;
            color: #1a0505;
            box-shadow: 0 0 20px #ffd700, inset 0 0 5px #fff;
            text-shadow: none;
            font-weight: bold;
            transform: scale(1.05);
        }
        @keyframes marqueeLight {
            0% { border-color: #d41414; box-shadow: 0 0 30px #ffd700; }
            100% { border-color: #ffd700; box-shadow: 0 0 50px #ff3b3b; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="room-box">
            <h2>CASINO ROOM</h2>
            <div class="room-code" id="roomCode">----</div>
        </div>
        <div id="qrcode"></div>
        <button class="btn-call" id="callBtn" autofocus>PULL LEVER</button>
    </div>

    <div class="main-content">
        <div class="top-row">
            <div class="current-number-box">
                <span>BALL</span>
                <div class="huge-number" id="currentBall">--</div>
            </div>
            <div class="alert-banner" id="bingoAlert">🎰 JACKPOT BINGO! 🎰</div>
        </div>
        <div class="board-container" id="bingoBoard"></div>
    </div>

    <script>
        const socket = io();
        let currentRoomId = null;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            initAudio();
            if (type === 'draw') {
                // Mechanical mechanical slot arm click-clack sound
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'win') {
                // Old-school casino coin-payout bell sound cascade
                for(let i=0; i<8; i++) {
                    setTimeout(() => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(987.77, audioCtx.currentTime); // B5 high ring
                        g.gain.setValueAtTime(0.2, audioCtx.currentTime);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                        o.start(); o.stop(audioCtx.currentTime + 0.2);
                    }, i * 150);
                }
            }
        }

        const bingoBoard = document.getElementById('bingoBoard');
        for (let i = 1; i <= 75; i++) {
            const ball = document.createElement('div');
            ball.classList.add('ball');
            ball.id = `ball-${i}`;
            ball.innerText = i;
            bingoBoard.appendChild(ball);
        }

        socket.emit('create-room');
        socket.on('room-created', (roomId) => {
            currentRoomId = roomId;
            document.getElementById('roomCode').innerText = roomId;
            const joinUrl = `${window.location.origin}/mobile.html?room=${roomId}`;
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById('qrcode'), { text: joinUrl, width: 140, height: 140 });
        });

        document.getElementById('callBtn').addEventListener('click', () => {
            if (currentRoomId) socket.emit('draw-number', currentRoomId);
            document.getElementById('bingoAlert').style.display = 'none';
        });

        socket.on('number-called', (data) => {
            playSound('draw');
            document.getElementById('currentBall').innerText = data.current;
            const activeBall = document.getElementById(`ball-${data.current}`);
            if (activeBall) activeBall.classList.add('called');
        });

        socket.on('bingo-claimed', (data) => {
            playSound('win');
            const alertBox = document.getElementById('bingoAlert');
            alertBox.innerText = `🎰 ${data.playerName.toUpperCase()} HITS JACKPOT! 🎰`;
            alertBox.style.display = 'flex';
        });
    </script>
</body>
</html>
